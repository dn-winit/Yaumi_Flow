# CI: hermetic gates that catch the bulk of staged-branch regressions
# without needing a real warehouse. Four parallel jobs:
#   1. python_compile -- byte-compile every module (import-time errors,
#                        syntax issues, broken relative imports).
#   2. python_lint    -- ruff check (unused imports, undefined names, BLE,
#                        UP, isort -- the conservative set from pyproject.toml).
#   3. python_test    -- pytest -m "not slow and not requires_db" so the
#                        ~100 hermetic tests guard against regressions in
#                        common/, services that don't need a live DB, etc.
#   4. webapp         -- lint + tsc -b --noEmit so TS or rule regressions
#                        cannot slip into staged or main.
#
# Anything heavier (db integration, e2e, slow LLM calls) requires the live
# warehouse and runs locally before each push.

name: CI

on:
  push:
    branches: [staged, main]
  pull_request:
    branches: [staged, main]

# Cancel in-flight runs on the same ref when a newer commit lands so we
# don't waste runner minutes on stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_compile:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all Python sources
        # ``compileall`` parses every file -- catches syntax errors and
        # broken indentation without needing any runtime dependency, so
        # this job stays fast and deterministic.
        run: |
          python -m compileall -q -j 0 \
            common \
            data_import \
            demand_forecasting_pipeline \
            recommended_order \
            llm_analytics \
            sales_supervision \
            scripts

  python_lint:
    name: Python lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pin to a major version so a future ruff release with new lints
        # cannot break CI without a deliberate dep-bump.
        run: pip install "ruff>=0.6,<1.0"

      - name: Ruff check
        # Rules + per-file ignores come from pyproject.toml (E, F, W, I, B, UP);
        # ``--no-fix`` so CI doesn't quietly mutate the tree.
        run: ruff check --no-fix .

  python_test:
    name: Python tests (hermetic only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            data_import/requirements.txt
            demand_forecasting_pipeline/requirements.txt
            recommended_order/requirements.txt
            sales_supervision/requirements.txt
            llm_analytics/requirements.txt

      - name: Install service deps
        # Install all five service requirement sets so any cross-package
        # import path resolves; pytest hits the ones flagged hermetic.
        run: |
          pip install -r data_import/requirements.txt
          pip install -r demand_forecasting_pipeline/requirements.txt
          pip install -r recommended_order/requirements.txt
          pip install -r sales_supervision/requirements.txt
          pip install -r llm_analytics/requirements.txt
          pip install pytest httpx python-dotenv

      - name: Run hermetic pytest
        # Skips ``slow`` (LLM calls / multi-minute recon) and
        # ``requires_db`` (needs a live warehouse) so this stays runnable
        # on GitHub-hosted runners. Coverage of common/, numeric, schema
        # validators, redistribution, scoring helpers, etc.
        run: pytest -m "not slow and not requires_db" --maxfail=5 -q

  webapp:
    name: Webapp lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # Flat ESLint config lives at webapp/eslint.config.js; rule set
        # is conservative (hooks, undefined names, unused imports) so the
        # gate catches real bugs without style churn.
        run: npm run lint

      - name: Format check
        # Prettier owns formatting -- the gate fails on drift so PRs land
        # on a uniform tree without per-author tab/space arguments.
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck
