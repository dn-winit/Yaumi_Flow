# CI: hermetic gates that catch the bulk of staged-branch regressions
# without needing a real warehouse.
#
# Required (red blocks merge):
#   - python_compile  : byte-compile every module.
#   - webapp          : lint + format:check + typecheck.
#
# Advisory (continue-on-error during baseline cleanup):
#   - python_lint     : ruff check. Existing tree has ~1.8k baseline
#                       findings that need incremental triage; the job
#                       reports red without blocking merge until the
#                       baseline is cleared. Track residue with
#                       ``ruff check --statistics``.
#   - python_test     : pytest -m "not slow and not requires_db".
#                       Hermetic test surface is currently small; tests
#                       under ``tests/`` mostly use ``httpx.Client``
#                       against ``localhost:*``, which won't connect on
#                       runners. Job runs so import-time regressions are
#                       caught, but failures don't block merge until
#                       ASGI-transport coverage exists.
#
# Anything heavier (db integration, e2e, slow LLM calls) requires the live
# warehouse and runs locally before each push.

name: CI

on:
  push:
    branches: [staged, main]
  pull_request:
    branches: [staged, main]

# Cancel in-flight runs on the same ref when a newer commit lands so we
# don't waste runner minutes on stale work.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python_compile:
    name: Python compile check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Byte-compile all Python sources
        # ``compileall`` parses every file -- catches syntax errors and
        # broken indentation without needing any runtime dependency, so
        # this job stays fast and deterministic.
        run: |
          python -m compileall -q -j 0 \
            common \
            data_import \
            demand_forecasting_pipeline \
            recommended_order \
            llm_analytics \
            sales_supervision \
            scripts

  python_lint:
    name: Python lint (ruff, advisory)
    runs-on: ubuntu-latest
    # Existing tree has a ~1.8k-finding baseline (mostly E402 path-setup
    # before imports, I001 isort, F401 unused re-exports). The job runs
    # red on those today but isn't a merge gate; track residue with
    # ``ruff check --statistics`` and clear by module.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ruff
        # Pin to a major version so a future ruff release with new lints
        # cannot break CI without a deliberate dep-bump.
        run: pip install "ruff>=0.6,<1.0"

      - name: Ruff check
        # Rules + per-file ignores come from pyproject.toml (E, F, W, I, B, UP);
        # ``--no-fix`` so CI doesn't quietly mutate the tree.
        run: ruff check --no-fix .

  python_test:
    name: Python tests (hermetic, advisory)
    runs-on: ubuntu-latest
    # Currently advisory because most tests use httpx against
    # ``localhost:*`` rather than FastAPI's ASGITransport. Once a
    # meaningful ASGI-transport surface exists, drop continue-on-error.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install unixODBC (pyodbc dep on linux)
        # pyodbc>=5 compiles against unixODBC headers; ubuntu-latest does
        # not ship them by default. Without this step the next
        # ``pip install -r`` fails at the ``pyodbc`` build stage.
        run: |
          sudo apt-get update -y
          sudo apt-get install -y unixodbc-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            data_import/requirements.txt
            demand_forecasting_pipeline/requirements.txt
            recommended_order/requirements.txt
            sales_supervision/requirements.txt
            llm_analytics/requirements.txt

      - name: Install service deps
        # Install all five service requirement sets so any cross-package
        # import path resolves; pytest hits the ones flagged hermetic.
        run: |
          pip install -r data_import/requirements.txt
          pip install -r demand_forecasting_pipeline/requirements.txt
          pip install -r recommended_order/requirements.txt
          pip install -r sales_supervision/requirements.txt
          pip install -r llm_analytics/requirements.txt
          pip install pytest httpx python-dotenv

      - name: Run hermetic pytest
        # Skips ``slow`` (LLM calls / multi-minute recon) and
        # ``requires_db`` (needs a live warehouse) so this stays runnable
        # on GitHub-hosted runners. Coverage of common/, numeric, schema
        # validators, redistribution, scoring helpers, etc.
        run: pytest -m "not slow and not requires_db" --maxfail=5 -q

  webapp:
    name: Webapp lint + typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: webapp/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        # Flat ESLint config lives at webapp/eslint.config.js; rule set
        # is conservative (hooks, undefined names, unused imports) so the
        # gate catches real bugs without style churn.
        run: npm run lint

      - name: Format check
        # Prettier owns formatting -- the gate fails on drift so PRs land
        # on a uniform tree without per-author tab/space arguments.
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck
