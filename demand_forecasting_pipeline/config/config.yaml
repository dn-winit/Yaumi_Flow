# Pipeline schema version; bump alongside breaking changes in config/schema.py.
version: "1.0"

project:
  name: demand_forecasting
  random_seed: 42
  log_level: INFO

paths:
  # Sales feed (data_import daily). Aligned with data_import.config.settings.sales_recent_file.
  raw_data: data/imports/sales_recent.csv
  # Non-DB training artifacts. Predictions live in data/imports/demand_forecast.csv (DB-canonical).
  artifacts_dir: data/forecast
  models_dir: data/forecast/models
  predictions_dir: data/forecast/predictions
  metrics_dir: data/forecast/metrics
  explainability_dir: data/forecast/explainability
  logs_dir: data/forecast/logs

data:
  forecast_level: [RouteCode, ItemCode]
  granularity: D
  date_col: TrxDate
  target_col: TotalQuantity
  meta_cols: [WarehouseName, ItemName, CategoryName]
  max_inactivity_periods: 180
  fill_missing_periods: true
  zero_fill_value: 0.0
  activity_flag: true
  # Pin code columns to string; sales_recent integers would otherwise strip leading zeros and break joins.
  dtypes:
    RouteCode: string
    ItemCode: string
  causal_cols:
    # vwap = volume-weighted average price (weighted by target_col).
    - col: AvgUnitPrice
      agg: vwap

validation:
  enabled: true
  # false -> duplicates summed by aggregator; true -> fail early to surface ETL bugs.
  fail_on_duplicates: false

lifecycle:
  enabled: true
  # First N panel rows after a pair's first non-zero sale flagged is_new_launch.
  new_launch_periods: 30
  # Silent tail >= this many rows flagged is_likely_eol.
  eol_silent_periods: 90

anomaly:
  suspicious_zeros:
    enabled: true
    min_history_periods: 60
    # Min distinct zero-runs needed to fit gap distribution; below this the detector abstains.
    min_zero_runs: 3
    # Flag zero runs longer than mean + z * std of the pair's gap lengths.
    z_threshold: 3.0

cleaning:
  clip_negative_to_zero: true
  per_pair_outlier:
    enabled: true
    method: iqr
    iqr_multiplier: 3.0
    skip_if_intermittent: true
    # Skip IQR if fewer than this many non-zero values (bounds would be pathological).
    min_nonzero_count: 8
    # Rows carrying any of these flags pass through unchanged.
    skip_if_flagged:
      - is_new_launch
      - is_likely_eol
      - suspicious_zero

split:
  # Horizons in *periods* at data.granularity. test_horizon drives leakage guarantees;
  # must be >= inference.forecast_horizon so test scoring matches production horizon.
  test_horizon: 30
  validation_horizon: 30

explainability:
  # Last N PERIODS feed recent_min/max/range_qty in pair_explainability.csv.
  # Periods (not days) so the window adapts to data.granularity (~6 months at any cadence).
  recent_window_periods: 180

training:
  # Refit champion on train+val+test before pickling so production sees ALL history.
  # Closes the 60-day blindspot; set false only for strict apples-to-apples comparison.
  refit_on_full_data: true

split_audit:
  # Per-pair balance thresholds. thin_train -> baseline-only routing; thin_test -> class-winner fallback.
  min_train_rows: 30
  min_test_rows: 3
  min_train_nonzero: 2

holidays:
  enabled: true
  country_code: AE
  subdivision: null
  # Proximity features at daily grain only; 0 disables is_pre_/is_post_ columns.
  proximity:
    enabled: true
    pre_window_days: 7
    post_window_days: 3
  # Optional group aggregation; library-emitted slugs only (inspect data_quality.json after a run).
  groups: {}
  # Phased events split long periods; flat {name, start, end} also supported.
  custom_events:
    - name: covid
      phases:
        - {name: panic,    start: "2020-03-01", end: "2020-04-30"}
        - {name: lockdown, start: "2020-05-01", end: "2020-12-31"}
        - {name: recovery, start: "2021-01-01", end: "2021-12-31"}

# Islamic calendar features via hijridate (no hardcoded dates).
hijri:
  enabled: true
  features:
    is_ramadan: true
    ramadan_day: true                # 1..30 within Ramadan, 0 elsewhere
    is_last_10_days_ramadan: true
  proximity:
    enabled: true
    pre_window_days: 7
    post_window_days: 3

# Salary cycle - region/business-specific so default off.
salary_cycle:
  enabled: false
  pay_rules: []
  # Example:
  # pay_rules:
  #   - {day_of_month: 1,  window_days: 5}
  #   - {day_of_month: 27, window_days: 3}
  features:
    days_since_last_payday: true
    days_to_next_payday: true
    in_payday_window: true

classification:
  adi_intermittent_threshold: 1.32
  cv2_erratic_threshold: 0.49
  # Pairs with fewer non-zero obs forced into ``intermittent`` (single-point series trivially has CV^2=0).
  min_observations_for_classification: 3
  # Exclude is_likely_eol tail from ADI/CV^2 so dormant mature SKUs aren't mis-routed to intermittent.
  exclude_eol_tail: true

feature_engineering:
  adaptive_depth: true
  # Fill NaN target-derived features with 0.0 by default; ``null`` keeps NaN for NaN-tolerant backends.
  nan_fill: 0.0
  # Far-future sentinel for proximity NaNs so models distinguish "no event" from "event today".
  proximity_nan_fill: 9999
  # Multi-step leakage guard: retain only lags >= forecast_horizon at training so inference can reproduce.
  # Production default true; false only for ablation.
  horizon_safe_lags: true
  target_encoding:
    enabled: true
    # Bayesian smoothing prior toward global mean (10 = FMCG default for 10s-100s obs/pair).
    smoothing: 10
    # K-fold count for leak-free OOF encoding on training rows. 5 is the tabular OOF standard.
    oof_folds: 5
  temporal:
    enabled: true
    # Date-aware weekend regime: UAE moved weekend Fri-Sat -> Sat-Sun on 2022-01-01.
    # Each rule applies to its [from, until) window; later rules overwrite earlier on overlap.
    # Legacy flat list (e.g. [4, 5]) still accepted.
    weekend_days:
      - {until: "2022-01-01", days: [4, 5]}
      - {from:  "2022-01-01", days: [5, 6]}
    components:
      - day_of_week
      - day_of_week_sin
      - day_of_week_cos
      - day_of_month
      - days_to_month_end
      - week_of_year
      - month
      - month_sin
      - month_cos
      - is_weekend
      - periods_since_start
  # Per-class lag lists. ``horizon_safe_lags`` filters to lags >= forecast_horizon (default 30).
  # SHORT and LONG lags listed explicitly so the config doubles as documentation across horizons.
  # At horizon=30, only [30, 60, 90] survive; long lags are MANDATORY -- without them tree models
  # collapse for smooth-class items (no TS signal, ~50% under-forecast). 365 omitted: Hijri +
  # month_sin/cos already capture annual signal and 365-day lag is too sparse on new SKUs.
  lags:
    smooth:       [1, 7, 14, 21, 28, 30, 60, 90]
    intermittent: [7, 14, 28, 30, 60, 90]
    erratic:      [1, 7, 14, 21, 28, 30, 60, 90]
    lumpy:        [7, 14, 28, 30, 60, 90]
  rolling:
    # Per-class windows/stats; min_periods_fraction defaults to 0.5 (roll_mean_28 needs >= 14 obs).
    smooth:
      windows: [7, 14, 28]
      stats: [mean, std, min, max, median]
      min_periods_fraction: 0.5
    intermittent:
      windows: [7, 14, 28]
      stats: [mean, sum, nonzero_ratio]
      min_periods_fraction: 0.5
    erratic:
      windows: [7, 14, 28]
      stats: [mean, std, max]
      min_periods_fraction: 0.5
    lumpy:
      windows: [7, 14, 28]
      stats: [mean, std, nonzero_ratio]
      min_periods_fraction: 0.5
  intermittent_specific:
    inter_demand_interval: true
    last_nonzero_gap: true
    nonzero_mean: true

model_selection:
  strategy: per_pair

# Per-pair model routing. Rules evaluated in priority order (highest first); first ``allow`` sets
# the base pool; ``exclude``/``prefer`` accumulate. Pairs matching no rule default to class's
# full ``models.enabled`` menu.
#
# Operators in ``when``: lt/lte/gt/gte/eq/ne, in/not_in, abs_gte/abs_lte, between, is_true/is_false.
# Signals: class, adi, cv2, n_periods, n_nonzero_periods, nonzero_ratio, mean_qty, max_qty,
# std_qty, sum_qty, nonzero_mean, nonzero_median, nonzero_min, nonzero_std, avg_gap_days,
# is_new_launch, is_likely_eol, suspicious_zero_rows.
routing:
  rules:
    - name: tiny_history
      priority: 100
      when: {n_periods: {lt: 10}}
      allow: [naive]

    - name: too_sparse_for_ml
      priority: 95
      when: {n_nonzero_periods: {lt: 3}}
      allow: [naive, moving_average]

    # Split-audit rules fire on post-split signals (per-pair window distribution).
    - name: no_test_rows
      priority: 94
      when: {n_test_rows: {eq: 0}}
      allow: [moving_average, naive]

    - name: insufficient_train_rows
      priority: 93
      when: {n_train_rows: {lt: 30}}
      allow: [moving_average, naive]

    - name: sparse_train_nonzero
      priority: 92
      when: {n_train_nonzero: {lt: 2}}
      allow: [naive, moving_average]

    - name: cold_start
      priority: 90
      when: {is_new_launch: {is_true: true}}
      allow: [moving_average, naive]

    - name: likely_eol
      priority: 85
      when: {is_likely_eol: {is_true: true}}
      allow: [moving_average, naive]

    - name: thin_history_skip_tuning
      priority: 50
      when: {n_periods: {lt: 90}}
      skip_hp_tuning: true

    - name: rich_history_deeper_tuning
      priority: 45
      when: {n_periods: {gte: 365}}
      # >=1yr history: spend 50% more trials searching their hyperparameter neighbourhood.
      hp_trials_multiplier: 1.5

    - name: very_sparse_intermittent
      priority: 80
      when:
        class: intermittent
        nonzero_ratio: {lt: 0.05}
      prefer: [croston_sba, croston]

    - name: heavy_tail_erratic
      priority: 75
      when:
        class: erratic
        cv2: {gte: 2.0}
      prefer: [lightgbm, ensemble]

    # Pattern-aware rules computed on train_window via treatment.recent_window_periods.
    # Never fire for cold-start/EOL (higher-priority rules already pin a naive/MA pool).
    - name: declining_demand
      priority: 65
      when:
        trend_direction: {eq: declining}
        is_likely_eol: {is_false: true}
      prefer: [ets, moving_average]

    - name: growing_demand
      priority: 65
      when:
        trend_direction: {eq: growing}
        is_new_launch: {is_false: true}
      prefer: [ets, lightgbm]

    - name: strongly_seasonal
      priority: 60
      when:
        seasonal_strength: {gte: 0.40}
      prefer: [ets, lightgbm]

    # Class-boundary pairs: broaden tuner budget without overriding ``allow``.
    - name: near_class_boundary
      priority: 40
      when:
        near_class_boundary: {is_true: true}
      hp_trials_multiplier: 1.3

# Knobs consumed by routing.pair_treatment.compute_pattern_signals.
treatment:
  recent_window_periods: 28
  trend:
    growing_threshold: 0.10        # relative slope*window/mean above this -> growing
    declining_threshold: -0.10     # below this -> declining
  seasonal:
    # Lag null -> auto-pick from data.granularity (7 for D, 4 for Q, 12 for M, 52 for W).
    lag: null
  boundary:
    adi_tolerance: 0.10            # |adi - adi_threshold| <= this -> near_class_boundary
    cv2_tolerance: 0.05
  cold_start:
    # Inference warm-start for pairs missing from pair_classes.csv: borrow per-date median across
    # same-route trained siblings; below min_route_siblings stays cold (no signal to borrow).
    enabled: true
    min_route_siblings: 2

models:
  enabled:
    smooth: [naive, moving_average, ets, linear, random_forest, lightgbm, xgboost, ensemble]
    intermittent: [croston, croston_sba, naive, moving_average, two_stage]
    erratic: [moving_average, random_forest, lightgbm, xgboost, ensemble, two_stage]
    lumpy: [croston, croston_sba, two_stage, moving_average]
  fallback_order: [moving_average, naive]
  # Champion-selection metric. Single name or per-class mapping; mapping is FMCG default
  # (WAPE for smooth/erratic; MASE for intermittent/lumpy per Hyndman-Koehler 2006).
  # ``default`` covers unnamed classes. Tuning, ranking, scoring all read through
  # ``_resolve_selection_metric`` for single source of truth.
  selection_metric:
    smooth: wape
    erratic: wape
    intermittent: mase
    lumpy: mase
    default: wape
  # Each model gets a flat default block; ``per_class:`` overrides merge over flat keys.
  model_defaults:
    moving_average:
      window: 7
      per_class:
        intermittent: {window: 28}   # sparse -> longer window to smooth gaps
        lumpy:        {window: 28}
    croston:
      alpha: 0.4
    croston_sba:
      alpha: 0.4
    ets:
      # seasonal_periods unset -> picked from data.granularity (7 daily, 52 weekly, 12 monthly, 4 quarterly).
      # trend: add + damped_trend: true is the academic standard for declining demand
      # (extrapolates slope but damps to avoid negative predictions).
      trend: add
      seasonal: null
      damped_trend: true
    linear:
      alpha: 1.0
    two_stage:
      regressor: lightgbm
      # prediction_mode: expected_value (default) -> E[y|X] = P(y>0|X) * E[y|y>0,X]; correct hurdle deploy.
      # ``threshold`` is legacy; new trainings default to expected_value.
      prediction_mode: expected_value
      threshold: 0.5
      # CalibratedClassifierCV wraps the classifier; raw class_weight="balanced" gives distorted
      # predict_proba. Adaptive cv capped by minority size; calibration skipped below 4 minority.
      calibrate_classifier: true
      calibration_method: isotonic   # or "sigmoid" for very small data
      calibration_cv: 5
      # Min positive training rows to fit regressor head; below, fall back to train-window mean.
      min_nonzero_for_regressor: 5
      per_class:
        # Intermittent demand -> lower threshold for recall on demand-occurred classifier.
        # Only honoured in ``threshold`` mode; expected_value combine handles low-prob days naturally.
        intermittent: {threshold: 0.4}
        lumpy:        {threshold: 0.4}

hyperparameter_tuning:
  enabled: true
  # Optuna TPE needs ~20 trials before exploiting promising regions. timeout caps per (class, model).
  n_trials: 25
  timeout_seconds: 600
  # ``auto`` derives direction from models.selection_metric (error -> minimize, score -> maximize).
  direction: auto
  temporal_cv:
    enabled: true
    n_splits: 3
    # val_size = distinct dates per fold's validation WINDOW. ``null`` -> tuner picks
    # (~ n_dates / (n_splits + 1)); set explicitly to match forecast_horizon.
    val_size: null
  # Models opted into Optuna. Classical models (moving_average, croston, ets) have tiny built-in
  # search spaces; can be added when validation data is available.
  # ``two_stage`` searches only the threshold; inner regressor inherits class-tuned LightGBM params.
  models_to_tune: [lightgbm, xgboost, random_forest, linear, two_stage]
  # Optional search-space override; entries here replace in-code defaults. Missing keep defaults.
  # Types: int / float (optionally log: true) / categorical.
  # Example:
  #   search_spaces:
  #     lightgbm:
  #       n_estimators: {type: int, low: 200, high: 1500}
  #       learning_rate: {type: float, low: 0.005, high: 0.1, log: true}
  search_spaces: {}
  # Data-size-adaptive bounds for tree-ensemble n_estimators:
  #   upper = clip(n_train_rows / divisor, cap_low_floor, cap_high_ceiling).
  # Any model whose search space declares n_estimators is auto-capped.
  adaptive_n_estimators:
    divisor: 50.0
    cap_low_floor: 100
    cap_high_ceiling: 2000

evaluation:
  # MASE (Hyndman & Koehler 2006): MAE / naive in-sample MAE. <1 beats naive, =1 naive, >1 worse.
  # Critical for FMCG sparse SKUs where MAE/WAPE alone hide naive-baseline comparison.
  metrics: [mae, rmse, mape, smape, bias, wape, mase]
  # Class-aware tolerances for composite headline accuracy: miss forgiven up to tolerance * actual.
  # Tighter for smooth, looser for lumpy. ``default`` for unrecognised/missing classes.
  composite_accuracy:
    tolerance_by_class:
      smooth:       0.10
      intermittent: 0.20
      erratic:      0.30
      lumpy:        0.40
    default: 0.20
  prediction_intervals:
    enabled: true
    quantiles: [0.1, 0.9]
    # Per-pair Conformalized Quantile Regression: adjusts class bands per-pair so stable pairs get
    # tighter intervals while volatile pairs stay honest. Quantile model fit on train; val calibrates;
    # produces conformal_offsets.csv.
    conformal:
      enabled: true
      # Marginal coverage on calibration set; 0.80 = 80% of val actuals within [q_low, q_high].
      # Drop to 0.50 for tight IQR; raise toward 0.95 for very conservative.
      target_coverage: 0.80
      # Pairs below this fall back to class-wide offset (classes with no rows fall back to global).
      # Keep >= ~5 for stable per-pair empirical quantile.
      min_samples_per_pair: 8
      # Audit holdout coverage per class; under-covering class scaled by target/observed,
      # clamped to [floor, ceiling], re-measured. Enforces target_coverage that raw conformal
      # often misses (LightGBM quantile bands trained on val don't always generalise to test).
      coverage_audit:
        enabled: true
        max_iterations: 3
        convergence_pp: 2.0
        # Per-iteration cap on additive widening to bound runaway. Raise for large demand units.
        max_shift_per_iter: 50.0

inference:
  forecast_horizon: 30
  # Recursive multi-step refinement: each iteration folds current predictions back into future panel
  # target column (history untouched), rebuilds lag/rolling, re-predicts.
  #   0     -> legacy direct-forecast (placeholder zeros; biased under-forecast at horizon>1)
  #   N     -> fixed N passes
  #   auto  -> min(horizon, max(1, horizon // max_lag))
  # Each iteration ~doubles inference time.
  recursive_iterations: auto
