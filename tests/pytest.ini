[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# By default skip slow tests (LLM calls, full reconciliation refreshes).
# Include them with: pytest -m "slow or not slow"
addopts = -m "not slow" --tb=short --strict-markers

markers =
    slow: long-running tests (LLM calls, reconciliation refresh)
    requires_db: needs a live AIML DB connection (auto-skip if unavailable)
    requires_live_data: needs today's plan on at least one configured route
    requires_live_server: needs the five backends running on the configured ports
        (auto-skip when no server is reachable). Tests under
        ``tests/common/`` and other hermetic suites do NOT carry this marker
        and use ``httpx.ASGITransport`` to run in-process on CI.
